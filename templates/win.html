<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Complete</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #400118; color: #f4e8cf; font-family: Arial, sans-serif; }
        main { width: min(90vw, 720px); padding: 56px 32px; border: 5px solid #986C19; border-radius: 18px; background: #731440; text-align: center; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); }
        h1 { margin: 0 0 18px; color: #B88D41; font-size: clamp(2rem, 6vw, 4rem); }
        p { margin: 0; font-size: clamp(1.1rem, 2.5vw, 1.5rem); }
    </style>
</head>
<body>
    <main>
        <h1>Mission Complete</h1>
        <p>Project GOLD has been cancelled.</p>
    </main>
</body>
</html>
