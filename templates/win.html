{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Complete</title>
    <link rel="stylesheet" href="{% static 'game/win.css' %}">
</head>
<body>
    <main>
        <h1>Mission Complete</h1>
        {% if elapsed_minutes is not None %}
            <p>Time taken: {{ elapsed_minutes }}:{% if elapsed_remainder < 10 %}0{% endif %}{{ elapsed_remainder }}</p>
        {% else %}
            <p>Time taken: unavailable</p>
        {% endif %}
    </main>
</body>
</html>
