databases:
  - name: lost-mysteries-db
    plan: free
    databaseName: lost_mysteries
    user: lost_mysteries

services:
  - type: web
    name: lost-mysteries
    plan: free
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m gunicorn escape_room.asgi:application -k uvicorn.workers.UvicornWorker
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lost-mysteries-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
